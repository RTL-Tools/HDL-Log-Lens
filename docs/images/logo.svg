<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="HDL Log Lens">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324d"/>
      <stop offset="1" stop-color="#0a1523"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="112" cy="112" r="55"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- lens: glass, rim, handle -->
  <circle cx="112" cy="112" r="62" fill="#5ee0ff" fill-opacity="0.07"/>
  <path d="M158 158 L205 205" stroke="#5ee0ff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="112" cy="112" r="62" fill="none" stroke="#5ee0ff" stroke-width="14"/>
  <!-- the log, seen through the lens: a digital waveform whose last pulse is the problem -->
  <g clip-path="url(#lens)" fill="none" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 134 H82 V90 H104 V134 H126" stroke="#7cffb2"/>
    <path d="M126 134 V90 H148 V134 H170" stroke="#ffb454"/>
  </g>
  <!-- glint -->
  <path d="M70 78 A50 50 0 0 1 96 62" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
</svg>
